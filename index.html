<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raj Chitale · Product Designer</title>
<meta name="description" content="Raj Chitale, product designer from India. Explore projects and experience in Design Nagari, an interactive 3D town.">
<meta name="theme-color" content="#141414">
<meta property="og:title" content="Raj Chitale · Product Designer">
<meta property="og:description" content="Explore my projects and experience in Design Nagari, an interactive 3D town.">
<meta property="og:type" content="website">
<style>body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed explorable 3D town; floating index sidebar (left on desktop, bottom sheet on phone) that swaps between index and detail views. Single dark look by choice. */
:root{
  --bg:#141414;
  --panel:rgba(22,22,22,.9);
  --panel-solid:#171717;
  --line:rgba(255,255,255,.08);
  --line-strong:rgba(255,255,255,.16);
  --fg:#ededed;
  --muted:#9a9a96;
  --faint:#6b6b67;
  --hover:rgba(255,255,255,.05);
  --accent:#f2b34a;          /* warm streetlight amber */
  --proj:#f2b34a;            /* projects: amber diamond */
  --work:#82b4ff;            /* experience: blue square */
  --key-bg:#262626;
  --font-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
  --vh:1vh;
}
@supports (height:1dvh){:root{--vh:1dvh}}
html,body{height:100%}
body{background:var(--bg);color:var(--muted);font-family:var(--font-sans);font-size:15px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--fg);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- scene ---------- */
#scene{position:fixed;inset:0;cursor:grab;touch-action:none}
#scene.dragging{cursor:grabbing}
#scene.pointing{cursor:pointer}
#scene canvas{display:block;width:100%;height:100%}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:4px 9px 4px 4px;border-radius:999px;background:rgba(20,20,20,.82);border:1px solid var(--line);color:var(--fg);font-size:12.5px;font-weight:500;white-space:nowrap;pointer-events:auto;transform-origin:50% 100%;transition:opacity .25s,background .2s,border-color .2s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lbl .k{font-family:var(--font-mono);font-size:11px;line-height:1;min-width:18px;height:18px;display:grid;place-items:center;border-radius:5px;background:var(--key-bg);color:var(--muted);border:1px solid var(--line-strong);transition:background .2s,color .2s}
.lbl.on{border-color:rgba(242,179,74,.5);background:rgba(28,24,18,.92)}
.lbl.on .k{background:var(--accent);color:#1b1408;border-color:transparent}
.lbl.page{color:var(--muted)}
.lbl .mk{width:8px;height:8px;flex:none;display:none}
.lbl.project .mk{display:block;background:var(--proj);transform:rotate(45deg);border-radius:1px}
.lbl.work .mk{display:block;background:var(--work);border-radius:2px}
.lbl.project,.lbl.work,.lbl.page{padding-left:10px;gap:7px}
.lbl.project{border-color:rgba(242,179,74,.32)}
.lbl.work{border-color:rgba(130,180,255,.32);background:rgba(16,20,28,.86)}
.lbl em{font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:var(--faint);margin-left:2px}
.lbl.work.on{border-color:rgba(130,180,255,.7);background:rgba(18,26,40,.94)}
.lbl.work.on .k{background:var(--work);color:#0d1726}
.lbl.raj{padding:3px 9px 3px 6px;background:#ededed;color:#141414;border-color:transparent;font-size:11.5px;font-weight:600;pointer-events:none;gap:5px}
.lbl.raj i{width:7px;height:7px;border-radius:50%;background:#e2563f;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.lbl.dim{opacity:0;pointer-events:none}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;transition:opacity .6s ease}
#loader.gone{opacity:0;pointer-events:none}
#loader .in{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--muted);font-size:14px}
.mono-av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#2b2b2b,#1c1c1c);border:1px solid var(--line-strong);color:var(--fg);font-family:var(--font-mono);font-size:14px;letter-spacing:.04em}
#loader .bar{width:120px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:40%;background:var(--accent);animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* ---------- sidebar ---------- */
#side{position:fixed;z-index:20;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:400px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden}
#side{transition:width .75s cubic-bezier(.65,0,.35,1),height .6s cubic-bezier(.65,0,.35,1),box-shadow .5s}
#side.expanded{width:min(1180px,calc(100vw - 24px - max(260px,27vw)));box-shadow:0 30px 90px rgba(0,0,0,.6)}
#side.expanded #scroll{padding:40px clamp(28px,4vw,64px) 56px}
#side.expanded .view{max-width:820px;gap:36px}
#side.expanded .d-head h2{font-size:clamp(30px,3.2vw,44px);letter-spacing:-.03em}
#side.expanded .d-head p{font-size:18px;max-width:60ch}
#side.expanded .meta{grid-template-columns:repeat(4,minmax(0,1fr))}
#side.expanded .prose p,#side.expanded .prose li{font-size:16px}
#side.expanded .prose h3{font-size:16px}
#side.expanded .decisions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
#side.expanded .related-sec .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px}
.peek-cta{display:none;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;border-radius:10px;border:1px solid var(--line-strong);color:var(--fg);font-size:13.5px;background:rgba(255,255,255,.03)}
#side.tall .peek-cta,#side.sel .peek-cta,#side.expanded .peek-cta{display:none!important}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:7px 11px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid var(--line);align-self:flex-start;margin:-6px 0 -14px}
.status i{width:7px;height:7px;border-radius:50%;background:#e2563f;animation:pulse 1s ease-in-out infinite}
#side.expanded .status{display:none}
#side .handle{display:none}
#scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:22px 22px 28px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.view{display:flex;flex-direction:column;gap:30px;animation:viewin .35s cubic-bezier(.2,.7,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.who{display:flex;flex-direction:column;gap:14px}
.who-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who-name{display:flex;align-items:center;gap:12px}
.who h1{font-size:15px;font-weight:600;color:var(--fg);margin:0;letter-spacing:-.005em}
.who .sub{font-size:13px;color:var(--faint)}
.clock{font-family:var(--font-mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.lede{display:flex;flex-direction:column;gap:2px;font-size:17px;line-height:1.45;color:var(--fg);letter-spacing:-.01em;text-wrap:balance}
.lede span:last-child{color:var(--accent)}
.intro{margin:0;max-width:62ch}
.intro a{border-bottom:1px solid var(--line-strong)}
.intro a:hover{border-color:var(--fg)}

.sec h2{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-family:var(--font-mono);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec h2 .ct{text-transform:none;letter-spacing:0;color:var(--faint);opacity:.75}
.sec .mk{width:9px;height:9px;flex:none}
.sec.proj h2{color:var(--proj)}
.sec.proj .mk{background:var(--proj);transform:rotate(45deg);border-radius:1px}
.sec.work h2{color:var(--work)}
.sec.work .mk{background:var(--work);border-radius:2px}
.sec.proj .list{border-left:2px solid rgba(242,179,74,.22);margin-left:0;padding-left:4px}
.timeline{position:relative}
.sec.work .timeline{margin-left:0;padding-left:16px}
.sec.work .timeline::before{content:"";position:absolute;left:4px;top:16px;bottom:16px;width:1px;background:rgba(130,180,255,.3)}
.sec.work .timeline .item{position:relative}
.sec.work .timeline .item::before{content:"";position:absolute;left:-15px;top:15px;width:7px;height:7px;border-radius:2px;background:var(--panel-solid);border:1.5px solid var(--work)}
.sec.work .timeline li:first-child .item::before{background:var(--work)}
.list{list-style:none;margin:0 -10px;padding:0;display:flex;flex-direction:column}
.item{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;transition:background .15s}
.item:hover,.item.hot{background:var(--hover)}
.item .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.item .t{color:var(--fg);font-weight:500;display:flex;align-items:center;gap:7px;min-width:0}
.item .t .arrow{opacity:0;transform:translateX(-4px);transition:.18s;color:var(--faint);font-size:13px}
.item:hover .t .arrow,.item.hot .t .arrow{opacity:1;transform:none}
.item .m{font-size:12.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.item .d{font-size:13.5px;color:var(--muted);line-height:1.45}
.links{display:flex;flex-wrap:wrap;gap:6px 14px}
.links a,.links button{color:var(--muted);font-size:14px;transition:color .15s}
.links a:hover,.links button:hover{color:var(--fg)}
.hint{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--faint);padding-top:14px;border-top:1px solid var(--line)}
.hint b{font-family:var(--font-mono);font-weight:400;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--key-bg);border:1px solid var(--line-strong);color:var(--muted);margin-right:5px}

/* detail view */
.back{align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:5px 10px 5px 6px;margin:-4px 0 -10px -6px;border-radius:8px;transition:.15s}
.back:hover{color:var(--fg);background:var(--hover)}
.back b{font-family:var(--font-mono);font-weight:400;font-size:10.5px;padding:1px 5px;border-radius:4px;background:var(--key-bg);border:1px solid var(--line-strong)}
.d-head{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--proj)}
.eyebrow.work{color:var(--work)}
.d-head h2{margin:0;font-size:26px;line-height:1.15;font-weight:600;color:var(--fg);letter-spacing:-.025em;text-wrap:balance}
.d-head p{margin:0;font-size:16px;color:var(--muted);text-wrap:pretty}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;padding:14px 0;border-block:1px solid var(--line);margin:0}
.meta div{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta dt{font-family:var(--font-mono);font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.meta dd{margin:0;font-size:13.5px;color:var(--fg)}
.prose{display:flex;flex-direction:column;gap:12px}
.prose h3{margin:10px 0 0;font-size:14px;font-weight:600;color:var(--fg)}
.prose p{margin:0;max-width:62ch}
.prose ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.prose li::marker{color:var(--faint)}
.prose strong{color:var(--fg);font-weight:500}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:s}
.steps li{position:relative;padding:0 0 14px 30px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-family:var(--font-mono);font-size:11px;background:var(--key-bg);border:1px solid var(--line-strong);color:var(--muted)}
.steps li::after{content:"";position:absolute;left:9.5px;top:24px;bottom:2px;width:1px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li.x::before{color:#d98b7a;border-color:rgba(217,139,122,.4)}
.steps li.ok::before{background:var(--accent);color:#1b1408;border-color:transparent}
.steps b{display:block;color:var(--fg);font-weight:500;font-size:14px}
.steps span{font-size:13.5px}
.decisions{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.decisions li{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02)}
.decisions b{display:block;color:var(--fg);font-weight:500;font-size:14px;margin-bottom:3px}
.decisions span{font-size:13.5px}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figure svg{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#1b1b1b}
figure.shot img{display:block;width:100%;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line-strong);background:#f5f6f8;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .25s}
figcaption{font-size:12px;color:var(--faint)}
.cta{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:9px 14px;border-radius:10px;background:var(--fg);color:#121212;font-weight:500;font-size:14px;transition:transform .15s,background .15s}
.cta:hover{background:#fff;transform:translateY(-1px)}
.cta.ghost{background:transparent;color:var(--fg);border:1px solid var(--line-strong)}
.cta.ghost:hover{background:var(--hover)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--fg);background:rgba(255,255,255,.03)}
.contact{display:flex;flex-direction:column;margin:0 -10px}
.contact .c{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:9px}
.contact .c:hover{background:var(--hover)}
.contact .c div{display:flex;flex-direction:column;min-width:0}
.contact .c small{font-family:var(--font-mono);font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.contact .c span,.contact .c a{color:var(--fg);user-select:all;overflow-wrap:anywhere}
.copy{font-size:12px;color:var(--muted);padding:4px 9px;border-radius:7px;border:1px solid var(--line-strong);white-space:nowrap}
.copy:hover{color:var(--fg)}
.related{display:flex;flex-direction:column;gap:6px}

/* map controls */
#ctrl{position:fixed;z-index:15;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
#ctrl button{width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;font-size:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.15s}
#ctrl button:hover{color:var(--fg);border-color:var(--line-strong)}
#legend{position:fixed;z-index:15;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;padding:7px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--muted);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#legend span{display:flex;align-items:center;gap:6px}
#legend i{width:8px;height:8px;display:block}
#legend .p{background:var(--proj);transform:rotate(45deg);border-radius:1px}
#legend .w{background:var(--work);border-radius:2px}
#legend .r{background:#e2563f;border-radius:50%}
#nogl{position:fixed;right:24px;top:24px;max-width:300px;font-size:13px;color:var(--faint)}

@media (max-width:900px) and (min-height:501px), (max-width:600px){
  #side{top:auto;left:0;right:0;bottom:0;width:auto;height:max(200px,calc(var(--vh)*27));border-radius:18px 18px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);transition:height .45s cubic-bezier(.2,.7,.2,1)}
  #side.tall{height:calc(var(--vh)*88 - env(safe-area-inset-top,0px))}
  #side.sel{height:max(260px,calc(var(--vh)*44))}
  #side .handle{cursor:pointer;padding:10px 0 4px}
  #side:not(.tall):not(.sel):not(.expanded) .lede span:nth-child(n+2), #side:not(.tall):not(.sel):not(.expanded) .intro{display:none}
  .peek-cta{display:flex}
  #side.expanded{width:auto;height:calc(var(--vh)*92 - env(safe-area-inset-top,0px))}
  #side.expanded .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  #side.expanded .decisions{display:flex}
  #side.expanded .related-sec .list{display:flex}
  #side.expanded #scroll{padding:14px max(18px,env(safe-area-inset-right,0px)) 32px max(18px,env(safe-area-inset-left,0px))}
  #side .handle{display:flex;justify-content:center;padding:9px 0 2px;width:100%}
  #side .handle i{width:38px;height:4px;border-radius:4px;background:var(--line-strong)}
  #scroll{padding:10px max(18px,env(safe-area-inset-right,0px)) 28px max(18px,env(safe-area-inset-left,0px))}
  #ctrl{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
  #legend{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px));right:auto;left:max(12px,env(safe-area-inset-left,0px));gap:9px;padding:6px 10px;font-size:11px}
  .d-head h2{font-size:23px}
  #side .who-top{gap:10px}
  #side.expanded .d-head h2{font-size:clamp(24px,6.6vw,30px)}
  #side.expanded .d-head p{font-size:16px}
  #side.expanded .prose p,#side.expanded .prose li{font-size:15px}
}
/* tablets in portrait: keep the sheet readable rather than edge to edge */
@media (min-width:601px) and (max-width:900px) and (min-height:501px){
  #side{left:50%;right:auto;width:min(680px,calc(100vw - 32px));transform:translateX(-50%)}
  #side.expanded{width:min(760px,calc(100vw - 24px))}
}
/* phones in landscape and other short screens: slim side panel */
@media (max-height:500px) and (min-width:601px){
  #side{top:calc(8px + env(safe-area-inset-top,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));left:calc(8px + env(safe-area-inset-left,0px));width:min(320px,42vw);border-radius:14px}
  #side.expanded{width:calc(100vw - 16px - env(safe-area-inset-left,0px) - max(200px,30vw))}
  #scroll{padding:14px 16px 20px}
  #side.expanded #scroll{padding:18px 24px 28px}
  .lede{font-size:15px}
  .intro{font-size:13.5px}
  .view{gap:22px}
  #side.expanded .d-head h2{font-size:26px}
  #side.expanded .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  #side.expanded .decisions{display:flex}
  #legend{display:none}
  #ctrl{bottom:calc(8px + env(safe-area-inset-bottom,0px));right:calc(8px + env(safe-area-inset-right,0px))}
}
/* hints follow the input device, not the screen width */
@media (pointer:coarse){.hint .desk{display:none}}
@media (pointer:fine){.hint .touch{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>


</head>
<body>
<div id="scene" aria-hidden="true"></div>
<div id="labels" aria-hidden="true"></div>

<div id="loader" role="status">
  <div class="in"><div class="mono-av">RC</div><span>Opening the scene…</span><div class="bar"><i></i></div></div>
</div>

<aside id="side" aria-label="Portfolio">
  <button class="handle" id="handle" aria-label="Resize panel"><i></i></button>
  <div id="scroll"><div id="view"></div></div>
</aside>

<div id="legend" aria-hidden="true"><span><i class="p"></i>Project</span><span><i class="w"></i>Experience</span><span><i class="r"></i>Raj</span></div>
<div id="ctrl">

    <div class="d-head"><span class="eyebrow">Case study · B2B fintech</span><h2>Making transaction restrictions safe to operate</h2>
    <p>Part of the end-to-end redesign of BSE Star MF, India’s largest web-based mutual fund distribution platform, used by the BSE team, brokers and financial institutions.</p></div>
    <dl class="meta"><div><dt>Role</dt><dd>Jr UX Designer</dd></div><div><dt>Studio</dt><dd>Yellow Slice</dd></div><div><dt>Platform</dt><dd>Web, B2B</dd></div><div><dt>Published</dt><dd>July 2024</dd></div></dl>
    <div class="prose">
      <h3>Context</h3>
      <p>The platform was built in 2009, when mutual funds had a much smaller audience, and it was designed purely to support functionality. As investing grew, the system was no longer enough for the scale it had to serve. The redesign began with simplifying how an AMC (asset management company) is registered on the platform.</p>
      <p>AMC registration carries several cross-functions. This case covers one of them: <strong>Transaction Restrictions</strong>, which block transactions for an AMC’s schemes in specific countries.</p>
      <h3>The problem</h3>
      <ul>
        <li>Restrictions lived in separate tabs reached through the top navigation.</li>
        <li>They only work once an AMC exists and its schemes are live, so users had to move between several windows to set one up.</li>
        <li>A mistake here could cause losses for the AMC, so the cost of confusion was high.</li>
      </ul>
      <h3>How the solution evolved</h3>
    </div>
    <ol class="steps">
      <li><b>Audit the existing flow</b><span>Mapped the dependency chain: create AMC, create schemes, schemes go live, then restrict.</span></li>
      <li class="x"><b>Option 1: a sixth step in the AMC update flow</b><span>Rejected. Onboarding was already five steps, the step would appear in updates but not onboarding, and users would be exposed to the full AMC record where accidental edits cost approval time.</span></li>
      <li class="ok"><b>Option 2: a dedicated page under the AMC section</b><span>Detached the restriction flow from AMC updates and gave it its own home in the navigation.</span></li>
    </ol>
    <div class="prose">
      <h3>Constraints the design had to hold</h3>
      <ul>
        <li>Some countries are predefined by the Government of India and blocked for every AMC.</li>
        <li>Transactions are inflow or outflow; either or both can be restricted.</li>
        <li>Scheme operations (direct, SIP, SWP, STP and more) can be restricted individually or together.</li>
      </ul>
      <h3>Key decisions</h3>
    </div>
    <ul class="decisions">
      <li><b>All AMCs or one, never several</b><span>Schemes are fetched per AMC, and in daily operations each AMC requests its own block. Multi-select added complexity with no real use case.</span></li>
      <li><b>Schemes in a paginated picker</b><span>An AMC can hold many schemes, so selection moved into a popup supporting one, many or all. Chosen schemes return to the main screen with an edit option.</span></li>
      <li><b>Smart search on every selector</b><span>Country, transaction type and tax status all got search, which cut the effort of long dropdowns.</span></li>
      <li><b>Sidebar navigation for the whole platform</b><span>Every function grouped in one place, removing the repetition of the old top navigation.</span></li>
      <li><b>One template for every function</b><span>Each function opens on a data table of approved, rejected and pending records, with a primary action to create a new one.</span></li>
      <li><b>One page, read as steps</b><span>The whole activity sits on a single page, grouped so it reads as a sequence rather than scattered fields.</span></li>
    </ul>
    ${BSE_FIG}
    <div class="prose">
      <h3>Outcome</h3>
      <p>Users could find the function without hunting, the back-and-forth between pages was removed, and the time to complete a restriction dropped noticeably. The structure also reduced the room for human error on a task where errors are expensive.</p>
    </div>
    <a class="cta" href="https://medium.com/@rajchitale/redesigning-mutual-fund-distribution-platform-c0d8bbccd5c3" target="_blank" rel="noopener">Read the full write-up on Medium ↗</a>`},

  {id:"tata-mf", kind:"project", name:"Tata Mutual Fund", pos:[-0.5,20.5], h:8,
   short:"Taking Tata Mutual Fund from desktop web to a mobile-first app",
   meta:"Mobile app · ’24",
   body:()=>`
    <div class="d-head"><span class="eyebrow">Case study · Fintech · Zero to one</span><h2>Tata Mutual Fund: building the app from zero</h2>
    <p>Designing Tata Asset Management’s first native investing app for iOS and Android, so mobile-first investors could start and track mutual fund investments without fighting a desktop interface.</p></div>
    <dl class="meta"><div><dt>Role</dt><dd>UX strategy, product &amp; interaction design, design system</dd></div><div><dt>Client</dt><dd>Tata Asset Management</dd></div><div><dt>Platform</dt><dd>iOS &amp; Android</dd></div><div><dt>Year</dt><dd>2024</dd></div></dl>
    <div class="prose">
      <h3>The problem</h3>
      <p>Tata’s investing experience lived on a desktop web platform built around dense tables and multi-step forms that broke down on a phone. Meanwhile app-native platforms like Groww, Zerodha and ET Money were winning first-time investors.</p>
      <ul>
        <li><strong>No native mobile presence</strong> for a growing mobile-first audience.</li>
        <li><strong>Desktop flows ported as-is</strong>, so tasks that should take about 3 steps took 8 to 12.</li>
        <li><strong>First-time investor anxiety</strong>: raw NAV tables and fact sheets with little guidance.</li>
        <li><strong>Lost acquisition share</strong> to competitors with faster onboarding.</li>
      </ul>
      <h3>Research</h3>
      <p>A six-week discovery sprint before any screens were drawn:</p>
    </div>
    <ul class="decisions">
      <li><b>24 in-depth interviews</b><span>With mobile-first investors aged 22 to 38.</span></li>
      <li><b>Heatmap and session analysis</b><span>On the existing mobile web, pinpointing the five screens where people dropped off most.</span></li>
      <li><b>Competitive teardowns</b><span>Groww, Zerodha Coin, ET Money, Paytm Money and Kuvera.</span></li>
      <li><b>Jobs-to-be-done workshops</b><span>With internal product managers and distribution partners.</span></li>
    </ul>
    <div class="prose"><h3>Who we designed for</h3></div>
    <ul class="decisions">
      <li><b>First-time investor · 25–32</b><span>Wants guidance and reassurance before starting a first SIP.</span></li>
      <li><b>Active portfolio builder · 28–40</b><span>Wants a fast, data-rich view of folios, NAVs and returns.</span></li>
      <li><b>Goal-based planner · 30–45</b><span>Saving for education, a home or retirement, and needs tools built around those goals.</span></li>
    </ul>
    <div class="prose">
      <h3>Key insight</h3>
      <p>Investors overwhelmed by fund choice and jargon don’t need a smaller desktop. They need guidance and a feeling of safety at every step.</p>
      <h3>Key decisions</h3>
    </div>
    <ul class="decisions">
      <li><b>Five bottom tabs instead of a mega-menu</b><span>The information architecture was rebuilt around five zones reachable with one hand.</span></li>
      <li><b>Portfolio 360°</b><span>Mutual funds, stocks and linked bank accounts on a single screen.</span></li>
      <li><b>A three-step start</b><span>KYC, bank linking and the first SIP compressed into one guided flow with inline validation.</span></li>
      <li><b>Goals in the core experience</b><span>A FIRE calculator, retirement planner and financial roadmap built in, not bolted on.</span></li>
      <li><b>A design system of 120+ components</b><span>Covering both iOS and Android variants.</span></li>
    </ul>
    <div class="prose"><h3>Wireframes</h3><p>Low-fidelity flows for Home, Explore, Goals and SIP set the structure before any visual design.</p></div>
    <figure class="shot"><img src="${TMF_WF}" width="1500" height="1000" alt="Low-fidelity wireframes of the Tata Mutual Fund app: home with portfolio summary and quick links, a goal roadmap, account menu, holding analysis chart, goal tracking dashboard, sector breakdown, index fund detail and a knowledge center." loading="lazy" decoding="async"><figcaption>Wireframes for the key flows.</figcaption></figure>
    <div class="prose"><h3>Visual design</h3><p>The high-fidelity design uses calm colour, progress rings and plain-language labels to lower the anxiety of investing.</p></div>
    <figure class="shot"><img src="${TMF_VD}" width="1500" height="1000" alt="High-fidelity screens of the Tata Mutual Fund app: personalised home, goal roadmap with progress rings, account menu, holding analysis, goal tracking dashboard, sector breakdown, Tata BSE Sensex Index Fund detail and video learning content." loading="lazy" decoding="async"><figcaption>Final visual design across the same flows.</figcaption></figure>`},

function renderDetail(e){
  const rel = ENT.filter(x=>x.kind===e.kind && x.id!==e.id && x.body);
  view.innerHTML = `<div class="view">
    <button class="back" data-back><span>←</span> Design Nagari <b>Esc</b></button>
    <div class="status" id="status"><i></i>Raj is heading to ${e.name}…</div>
    ${e.body()}
    ${rel.length?`<section class="sec related-sec"><h2>${e.kind==="project"?"More projects":e.kind==="work"?"More experience":"Around town"}</h2><ul class="list">${rel.map(itemBtn).join("")}</ul></section>`:""}
  </div>`;
}

function openEnt(id, opts={}){
  const e = byId(id);
  if(!e || !e.body){ return; }
  current = id;
  renderDetail(e);
  scrollEl.scrollTop = 0;
  if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id);
  side.classList.remove("expanded","tall");
  if(isMobile()) side.classList.add("sel");
  if(window.Town) Town.go(e, opts.instant); else side.classList.add("expanded");
  setActiveLabel(id);
}
function onEntered(e){
  if(current!==e.id) return;
  side.classList.add("expanded"); side.classList.remove("sel");
  const st=document.getElementById("status"); if(st) st.remove();
}
function closeDetail(){
  current = null;
  renderIndex();
  history.replaceState(null,"",location.pathname+location.search);
  side.classList.remove("expanded","sel","tall");
  scrollEl.scrollTop=0;
  if(window.Town) Town.back();
  setActiveLabel(null);
}

document.addEventListener("click", ev=>{
  const go = ev.target.closest("[data-go]");
  if(go){ ev.preventDefault(); openEnt(go.dataset.go); return; }
  if(ev.target.closest("[data-back]")){ closeDetail(); return; }
  const cp = ev.target.closest("[data-copy]");
  if(cp){
    const txt = cp.dataset.copy;
    const done = ()=>{ cp.textContent="Copied"; setTimeout(()=>cp.textContent="Copy",1400); };
    try{
      navigator.clipboard.writeText(txt).then(done).catch(()=>selectNear(cp));
    }catch(_){ selectNear(cp); }
  }
});
function selectNear(btn){
  const span = btn.parentElement.querySelector("span");
  const r = document.createRange(); r.selectNodeContents(span);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
document.addEventListener("mouseover", ev=>{
  const h = ev.target.closest("[data-hover]");
  if(window.Town) Town.hoverFromList(h?h.dataset.hover:null);
});
const SHEET_MQ = matchMedia("(max-width: 900px) and (min-height: 501px), (max-width: 600px)");
function isMobile(){ return SHEET_MQ.matches; }
document.addEventListener("click", ev=>{ if(ev.target.closest("[data-peek]")){ side.classList.add("tall"); } });
// on phones, scrolling the peeking sheet pulls it up
scrollEl.addEventListener("scroll", ()=>{ if(isMobile() && !current && scrollEl.scrollTop>6) side.classList.add("tall"); }, {passive:true});
SHEET_MQ.addEventListener && SHEET_MQ.addEventListener('change', ()=>{ side.classList.remove('tall','sel'); if(window.Town) Town.resize(); });
function collapseSheet(){ if(isMobile() && !current) side.classList.remove("tall"); }
document.getElementById("handle").addEventListener("click", ()=>{
  if(side.classList.contains("expanded")||side.classList.contains("sel")) return;
  side.classList.toggle("tall");
  if(window.Town) setTimeout(()=>Town.resize(),360);
});
window.addEventListener("hashchange", ()=>{
  const id = location.hash.slice(1);
  if(id && id!==current && byId(id)) openEnt(id);
});

function tick(){
  const c = document.getElementById("clock"); if(!c) return;
  try{
    c.textContent = new Intl.DateTimeFormat("en-IN",{timeZone:"Asia/Kolkata",hour:"numeric",minute:"2-digit",hour12:true}).format(new Date()).toUpperCase()+" IST";
  }catch(_){ c.textContent="IST"; }
}
setInterval(tick, 15000);

    // keyboard pan
    if(keys.size){ follow=false;
      const sp = want.dist*0.9*dt, ca=Math.cos(want.az), sa=Math.sin(want.az);
      let fx=0,fz=0;
      if(keys.has("w")||keys.has("arrowup")) fz-=1; if(keys.has("s")||keys.has("arrowdown")) fz+=1;
      if(keys.has("a")||keys.has("arrowleft")) fx-=1; if(keys.has("d")||keys.has("arrowright")) fx+=1;
      want.tx += (fx*ca + fz*sa)*sp; want.tz += (-fx*sa + fz*ca)*sp; clampTarget();
    }
    const k = reduce ? 1 : 1 - Math.pow(0.0015, dt);
    for(const p of ["tx","ty","tz","az","pol","dist"]) cam[p] += (want[p]-cam[p])*k;
    viewOffset(innerWidth,innerHeight); camera.updateProjectionMatrix();
    scene.fog.near = cam.dist*0.9; scene.fog.far = cam.dist*1.9;
    applyCam();
    if(!reduce){
      const bub = groups["hdfc-support"].userData.bub; bub.position.y = 6.2 + Math.sin(t*1.6)*0.25;
      groups["bse-star-mf"].traverse(o=>{ if(o.userData.spin) o.rotation.y = t*0.8; if(o.userData.blink) o.visible = (t%2)<1.4; });
      groups["idealake"].traverse(o=>{ if(o.userData.blink) o.visible = (t%2)<1.2; });
    }
    stepRaj(Math.min(raw,0.25), t);
    renderer.render(scene,camera);
    placeLabels();
    if(first){ first=false; setTimeout(finishLoading, 250); }
    requestAnimationFrame(frame);
  }

  window.Town = {
    flyTo, go, back, home, resize:()=>{ resize(); },
    setHover, hoverFromList:id=>{ listHover=id; paint(); }
  };
  resize();
  applyCam();
  // open sidebar re-measure once fonts settle
  setTimeout(resize, 400);
  const startId = location.hash.slice(1);
  if(startId && byId(startId) && byId(startId).body){ openEnt(startId,{instant:false}); }
  // opening sweep: start wide and settle in
  if(!reduce && !startId){ cam.dist = HOME.dist*1.35; cam.az = HOME.az - 0.5; }
  requestAnimationFrame(frame);
})();

// Safety: never leave the loader up
setTimeout(finishLoading, 4000);
</script>
